# De tests draaien in een echte browser, dus CI heeft een echte browser nodig.
# Die komt uit het Docker-image van Playwright: browser en systeembibliotheken
# zitten er al in, zodat er geen apt-download is die op een trage spiegel van
# Ubuntu de run over zijn tien minuten duwt.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Een nieuwe push maakt de vorige run overbodig.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # De versie hoort gelijk aan playwright in package-lock.json; de eerste
    # stap hieronder breekt de run af als ze uit elkaar lopen.
    container: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - uses: actions/checkout@v4

      - name: Image past bij package-lock.json
        run: |
          lock=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          test "$lock" = "1.62.1" || { echo "playwright $lock in package-lock.json, image heeft 1.62.1: zet het image in test.yml op v$lock"; exit 1; }

      - run: npm ci

      # Duurt ruim een halve minuut: één beurt moet echt uitlopen om te zien
      # wat er gebeurt als de tijd om is.
      - run: npm test
