# De toverstaf (worker/tover.mjs). Uitgerold door .github/workflows/worker.yml
# op tijdisom-tover.<naam>.workers.dev; zie docs/ontwerp.md, Toveren.
name = "tijdisom-tover"
main = "tover.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[ai]
binding = "AI"

# Per adres hoogstens twaalf tekeningen per minuut. Over de dag begrenst het
# gratis budget van Workers AI de rest.
[[ratelimits]]
name = "PERKEER"
namespace_id = "4141"

  [ratelimits.simple]
  limit = 12
  period = 60

[observability]
enabled = false
